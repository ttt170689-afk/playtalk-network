     PLAYTALK v38 — РАБОЧИЕ ЗВОНКИ + ФИКС ОТПРАВКИ СООБЩЕНИЙ
     Этот блок вставляется в конец index.html перед </body>

<style id="pt-v38-style">
.pt-call-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,8,14,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:ptCallIn .18s ease}
.pt-call-overlay.hidden{display:none !important}
@keyframes ptCallIn{from{opacity:0}to{opacity:1}}
.pt-call-card{width:100%;max-width:720px;background:#141d27;border:1px solid rgba(255,255,255,.08);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.75);display:flex;flex-direction:column}
.pt-call-stage{position:relative;width:100%;aspect-ratio:16/10;background:radial-gradient(circle at 50% 30%,#1f2c3a,#0b1219);overflow:hidden}
#ptRemoteVideo{width:100%;height:100%;object-fit:cover;display:none;background:#000}
.pt-call-card.has-remote-video #ptRemoteVideo{display:block}
#ptLocalVideo{position:absolute;right:14px;bottom:14px;width:150px;height:104px;object-fit:cover;border-radius:14px;border:2px solid rgba(82,136,193,.6);background:#000;display:none;z-index:3;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.pt-call-card.has-local-video #ptLocalVideo{display:block}
.pt-call-poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:2}
.pt-call-card.has-remote-video .pt-call-poster{display:none}
.pt-call-avatar{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff;background:linear-gradient(135deg,#649bd3,#2b5278);box-shadow:0 0 0 0 rgba(82,136,193,.5)}
.pt-call-avatar.ringing{animation:ptRing 1.6s infinite}
@keyframes ptRing{0%{box-shadow:0 0 0 0 rgba(82,136,193,.55)}70%{box-shadow:0 0 0 26px rgba(82,136,193,0)}100%{box-shadow:0 0 0 0 rgba(82,136,193,0)}}
.pt-call-name{font-size:22px;font-weight:800;color:#fff}
.pt-call-status{font-size:14px;color:#9fb3c8;font-weight:600;letter-spacing:.2px}
.pt-call-badge{position:absolute;top:14px;left:14px;z-index:4;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:700}
.pt-call-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:ptBlink 1.4s infinite}
@keyframes ptBlink{0%,100%{opacity:1}50%{opacity:.25}}
.pt-call-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:18px}
.pt-cbtn{min-width:56px;height:56px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pt-cbtn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.pt-cbtn.off{background:rgba(255,255,255,.22);color:#0e1621}
.pt-cbtn.accept{background:#3fae63;border-color:transparent;font-size:15px}
.pt-cbtn.accept:hover{background:#48c471}
.pt-cbtn.decline,.pt-cbtn.end{background:#e5544a;border-color:transparent;font-size:15px}
.pt-cbtn.decline:hover,.pt-cbtn.end:hover{background:#f0655b}
.pt-cbtn.hidden{display:none !important}
.pt-msg-pending{opacity:.62}
.pt-send-busy{opacity:.55;pointer-events:none}
.pt-fail-note{margin:6px 12px 0;padding:9px 12px;border-radius:12px;background:rgba(229,84,74,.12);border:1px solid rgba(229,84,74,.28);color:#ffd9d5;font-size:12px;font-weight:600;line-height:1.5}
@media(max-width:768px){.pt-call-card{max-width:100%;border-radius:18px}.pt-call-stage{aspect-ratio:3/4}#ptLocalVideo{width:104px;height:74px}.pt-cbtn{min-width:52px;height:52px;font-size:18px}}
</style>

<script id="pt-v38-fix-script">
(() => {
  if (window.__playTalkV38Loaded) return;
  window.__playTalkV38Loaded = true;

  const SUPABASE_URL = 'https://kxfrlggnjkrquczjaiqb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_okGGbpyPata_z311qSkTnQ_NhnFwZ5G';
  const RTC_TOPIC    = 'pt-rtc-v38';
  const RING_TIMEOUT = 45000;

  /* TURN нужен, если собеседники в разных сетях (мобильный интернет, CGNAT).
     Свои сервера можно задать в config.js:  window.PLAYTALK_TURN = [{urls:'turn:...',username:'',credential:''}] */
  const DEFAULT_ICE = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
    { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ];
  const iceServers = () => (Array.isArray(window.PLAYTALK_TURN) && window.PLAYTALK_TURN.length)
    ? [{ urls: ['stun:stun.l.google.com:19302'] }].concat(window.PLAYTALK_TURN)
    : DEFAULT_ICE;

  const $ = id => document.getElementById(id);
  const toast = m => { try { AppEngine.showToast(m); } catch (e) { console.log('[PT]', m); } };
  const me = () => (window.AppState && AppState.currentUser) || null;
  const log = (...a) => console.log('%c[PlayTalk v38]', 'color:#5288c1;font-weight:700', ...a);

  function getClient() {
    if (window.__ptClientV38) return window.__ptClientV38;
    let c = null;
    try { if (window.V36 && typeof V36.getClient === 'function') c = V36.getClient(); } catch (e) {}
    if (!c && window.supabase && window.supabase.createClient) {
      c = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    if (c) {
      window.__ptClientV38 = c;
      /* один клиент на всё приложение — иначе вторая копия GoTrue теряет сессию и insert падает по RLS */
      try { if (window.V36) { V36.client = c; V36.getClient = () => c; } } catch (e) {}
    }
    return c;
  }

  const chatKey = id => [me().id, id].sort().join('__');
  const userById = id => ((window.AppState && AppState.users) || []).find(u => u && u.id === id) || null;
  function displayName(user) {
    if (!user) return 'Пользователь';
    try { if (window.ContactsOnlyEngine) return ContactsOnlyEngine.displayName(user); } catch (e) {}
    return user.name || user.username || 'Пользователь';
  }
  function rerender() {
    try { MessagingEngine.renderMessages(); } catch (e) {}
    try { AppEngine.renderChatList(); } catch (e) {}
  }

  /* =========================================================
     1. ОТПРАВКА СООБЩЕНИЙ — поле очищается сразу, текст не теряется
     ========================================================= */
  const Send = {
    busy: false,

    setBusy(on) {
      this.busy = on;
      const btn = document.querySelector('.send-msg-btn');
      if (btn) btn.classList.toggle('pt-send-busy', on);
    },

    note(text) {
      const bar = document.querySelector('.chat-input-bar-container');
      if (!bar || !bar.parentNode) return;
      let el = $('ptFailNote');
      if (!text) { if (el) el.remove(); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'ptFailNote';
        el.className = 'pt-fail-note';
        bar.parentNode.insertBefore(el, bar);
      }
      el.textContent = text;
      clearTimeout(this._noteTimer);
      this._noteTimer = setTimeout(() => { const n = $('ptFailNote'); if (n) n.remove(); }, 9000);
    },

    async run() {
      const input = $('msgTextInput');
      if (!input) return;
      const original = input.value;
      const text = original.trim();
      if (!text) return;
      if (!me())                 { toast('Сначала войди в аккаунт'); return; }
      if (!AppState.activeChat)  { toast('Открой чат'); return; }
      if (this.busy) return;

      this.setBusy(true);
      this.note('');

      /* --- поле чистим СРАЗУ, до сети: именно из-за обратного порядка текст залипал --- */
      input.value = '';
      try { input.focus(); } catch (e) {}
      try { if (window.V36 && V36.sendTyping) V36.sendTyping(false); } catch (e) {}

      const chat = AppState.activeChat;
      const key = chatKey(chat.id);
      const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(16).slice(2);
      AppState.messages[key] = AppState.messages[key] || [];
      AppState.messages[key].push({
        id: tempId, senderId: me().id, recipientId: chat.id,
        text, time: Date.now(), type: 'text', pending: true
      });
      rerender();

      try {
        const client = getClient();
        if (!client) throw new Error('Supabase не загрузился (проверь интернет / блокировщик)');
        const { data, error } = await client.from('messages').insert({
          sender_id: me().id, recipient_id: chat.id, body: text
        }).select().single();
        if (error) throw error;

        const arr = AppState.messages[key] || [];
        const idx = arr.findIndex(m => m.id === tempId);
        const real = {
          id: data.id, senderId: data.sender_id, recipientId: data.recipient_id,
          text: data.body, time: new Date(data.created_at).getTime(), type: 'text'
        };
        if (idx !== -1) arr.splice(idx, 1);
        if (!arr.find(m => m.id === real.id)) arr.push(real);
        arr.sort((a, b) => a.time - b.time);
      } catch (err) {
        const arr = AppState.messages[key] || [];
        const idx = arr.findIndex(m => m.id === tempId);
        if (idx !== -1) arr.splice(idx, 1);
        /* текст не теряем: возвращаем в поле, если пользователь не начал печатать новое */
        if (!input.value.trim()) input.value = original;
        const msg = (err && (err.message || err.error_description)) || 'неизвестная ошибка';
        this.note('❌ Сообщение не отправлено: ' + msg + '. Текст вернули в поле — нажми ➤ ещё раз.');
        toast('❌ Не отправлено');
        console.error('[PlayTalk v38] send failed:', err);
      } finally {
        this.setBusy(false);
        rerender();
      }
    }
  };

  function lockMessaging() {
    if (!window.MessagingEngine) return;
    const fn = () => Send.run();
    try {
      Object.defineProperty(MessagingEngine, 'sendTextMessage', {
        configurable: false, get: () => fn, set: () => {}   /* блокируем перезапись поздними патчами */
      });
    } catch (e) { MessagingEngine.sendTextMessage = fn; }

    /* галочка "часики" у неотправленных */
    const originalRender = MessagingEngine.renderMessages.bind(MessagingEngine);
    const patched = function () {
      originalRender();
      try {
        if (!AppState.activeChat || !me()) return;
        const list = AppState.messages[chatKey(AppState.activeChat.id)] || [];
        if (!list.some(m => m.pending)) return;
        const rows = [...document.querySelectorAll('#messagesViewport .msg-row-container')];
        list.forEach((m, i) => {
          if (!m.pending || !rows[i]) return;
          rows[i].classList.add('pt-msg-pending');
          const check = rows[i].querySelector('.msg-check-mark');
          if (check) check.textContent = '🕐';
        });
      } catch (e) {}
    };
    try {
      Object.defineProperty(MessagingEngine, 'renderMessages', {
        configurable: false, get: () => patched, set: () => {}
      });
    } catch (e) { MessagingEngine.renderMessages = patched; }
  }

  function bindInput() {
    const input = $('msgTextInput');
    if (!input || input.dataset.v38 === '1') return;
    input.dataset.v38 = '1';
    input.removeAttribute('onkeydown');
    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      if (e.isComposing || e.keyCode === 229) return;   /* не рвём набор через IME */
      e.preventDefault();
      Send.run();
    });
    const btn = document.querySelector('.send-msg-btn');
    if (btn && btn.dataset.v38 !== '1') {
      btn.dataset.v38 = '1';
      btn.removeAttribute('onclick');
      btn.addEventListener('click', e => { e.preventDefault(); Send.run(); });
    }
  }

  /* =========================================================
     2. ЗВОНКИ — сигналинг через Supabase Realtime + приём/отклонение
     ========================================================= */
  const Call = {
    state: 'idle',          /* idle | outgoing | incoming | active */
    pc: null,
    localStream: null,
    remoteStream: null,
    peerId: null,
    callId: null,
    video: false,
    channel: null,
    subscribedFor: null,
    pendingIce: [],
    remoteReady: false,
    ringTimer: null,
    durationTimer: null,
    startedAt: 0,
    audioCtx: null,
    ringOsc: null,

    /* ---------- UI ---------- */
    ui() {
      if ($('ptCallOverlay')) return;
      const wrap = document.createElement('div');
      wrap.id = 'ptCallOverlay';
      wrap.className = 'pt-call-overlay hidden';
      wrap.innerHTML =
        '<div class="pt-call-card" id="ptCallCard">' +
          '<div class="pt-call-stage">' +
            '<div class="pt-call-badge" id="ptCallBadge"><span class="pt-call-dot"></span><span id="ptCallBadgeText">Соединение</span></div>' +
            '<video id="ptRemoteVideo" autoplay playsinline></video>' +
            '<video id="ptLocalVideo" autoplay playsinline muted></video>' +
            '<div class="pt-call-poster">' +
              '<div class="pt-call-avatar" id="ptCallAvatar">?</div>' +
              '<div class="pt-call-name" id="ptCallName">—</div>' +
              '<div class="pt-call-status" id="ptCallStatus">Вызов...</div>' +
            '</div>' +
          '</div>' +
          '<div class="pt-call-controls">' +
            '<button class="pt-cbtn hidden" id="ptCallMute" title="Микрофон">🎤</button>' +
            '<button class="pt-cbtn hidden" id="ptCallCam" title="Камера">📷</button>' +
            '<button class="pt-cbtn accept hidden" id="ptCallAccept">📞 Принять</button>' +
            '<button class="pt-cbtn decline hidden" id="ptCallDecline">✕ Отклонить</button>' +
            '<button class="pt-cbtn end hidden" id="ptCallEnd">Завершить</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(wrap);
      $('ptCallAccept').onclick  = () => this.accept();
      $('ptCallDecline').onclick = () => this.hangup('decline');
      $('ptCallEnd').onclick     = () => this.hangup('end');
      $('ptCallMute').onclick    = () => this.toggleTrack('audio', $('ptCallMute'), '🎤', '🔇');
      $('ptCallCam').onclick     = () => this.toggleTrack('video', $('ptCallCam'), '📷', '🚫');
      /* старый оверлей больше не используем */
      const old = $('webrtcCallOverlay');
      if (old) old.classList.add('hidden');
    },

    show(mode, peer) {
      this.ui();
      const user = peer || userById(this.peerId);
      const name = displayName(user);
      $('ptCallName').textContent = name;
      const av = $('ptCallAvatar');
      if (user && user.avatar) { av.style.background = 'url(' + user.avatar + ') center/cover'; av.textContent = ''; }
      else { av.style.background = (user && user.color) || 'linear-gradient(135deg,#649bd3,#2b5278)'; av.textContent = (name || '?')[0].toUpperCase(); }
      av.classList.toggle('ringing', mode !== 'active');

      const inCall = mode === 'active';
      $('ptCallAccept').classList.toggle('hidden', mode !== 'incoming');
      $('ptCallDecline').classList.toggle('hidden', mode !== 'incoming');
      $('ptCallEnd').classList.toggle('hidden', mode === 'incoming');
      $('ptCallMute').classList.toggle('hidden', !inCall);
      $('ptCallCam').classList.toggle('hidden', !(inCall && this.video));
      $('ptCallBadge').style.display = inCall ? 'inline-flex' : 'none';
      $('ptCallOverlay').classList.remove('hidden');
      this.status(mode === 'incoming'
        ? (this.video ? 'Входящий видеозвонок' : 'Входящий звонок')
        : (mode === 'outgoing' ? 'Вызываем...' : 'Соединение...'));
    },

    status(text) { const el = $('ptCallStatus'); if (el) el.textContent = text; },
    badge(text)  { const el = $('ptCallBadgeText'); if (el) el.textContent = text; },
    hide() { const el = $('ptCallOverlay'); if (el) el.classList.add('hidden'); },

    toggleTrack(kind, btn, onIcon, offIcon) {
      if (!this.localStream) return;
      const tracks = kind === 'audio' ? this.localStream.getAudioTracks() : this.localStream.getVideoTracks();
      if (!tracks.length) return;
      const enabled = !tracks[0].enabled;
      tracks.forEach(t => { t.enabled = enabled; });
      btn.textContent = enabled ? onIcon : offIcon;
      btn.classList.toggle('off', !enabled);
      if (kind === 'video') $('ptCallCard').classList.toggle('has-local-video', enabled);
    },

    /* ---------- звук ---------- */
    tone(freq, ms, repeat) {
      try {
        this.audioCtx = this.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const ctx = this.audioCtx;
        if (ctx.state === 'suspended') ctx.resume();
        const beep = () => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + ms / 1000);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + ms / 1000 + 0.05);
        };
        beep();
        if (repeat) { this.ringOsc = setInterval(beep, repeat); }
      } catch (e) {}
    },
    stopTone() { clearInterval(this.ringOsc); this.ringOsc = null; },

    /* ---------- сигналинг ---------- */
    signal(payload) {
      if (!this.channel || !me()) return;
      this.channel.send({ type: 'broadcast', event: 'rtc', payload: Object.assign({ v: 38, from: me().id }, payload) });
    },

    subscribe() {
      const client = getClient();
      const user = me();
      if (!client || !user) return;
      if (this.subscribedFor === user.id && this.channel) return;
      if (this.channel) { try { client.removeChannel(this.channel); } catch (e) {} this.channel = null; }
      this.subscribedFor = user.id;
      this.channel = client.channel(RTC_TOPIC, { config: { broadcast: { self: false } } });
      this.channel
        .on('broadcast', { event: 'rtc' }, e => this.onSignal(e.payload))
        .subscribe(st => log('rtc channel:', st));
    },

    async onSignal(p) {
      const user = me();
      if (!p || !user || p.v !== 38 || p.to !== user.id) return;

      if (p.type === 'invite') {
        if (this.state !== 'idle') { this.signal({ type: 'busy', to: p.from, callId: p.callId }); return; }
        this.state = 'incoming';
        this.peerId = p.from;
        this.callId = p.callId;
        this.video = !!p.video;
        this.offer = p.sdp;
        this.pendingIce = [];
        this.show('incoming', userById(p.from));
        this.tone(660, 320, 1500);
        clearTimeout(this.ringTimer);
        this.ringTimer = setTimeout(() => { if (this.state === 'incoming') this.cleanup('Пропущенный звонок'); }, RING_TIMEOUT);
        return;
      }
      if (p.callId && this.callId && p.callId !== this.callId) return;

      if (p.type === 'accept' && this.pc) {
        clearTimeout(this.ringTimer);
        this.stopTone();
        await this.pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
        this.remoteReady = true;
        await this.flushIce();
        this.state = 'active';
        this.show('active');
        this.startTimer();
        return;
      }
      if (p.type === 'ice') {
        if (!this.pc || !this.remoteReady) { this.pendingIce.push(p.candidate); return; }
        try { await this.pc.addIceCandidate(p.candidate); } catch (e) {}
        return;
      }
      if (p.type === 'decline') { this.cleanup('Звонок отклонён'); this.tone(320, 260); return; }
      if (p.type === 'busy')    { this.cleanup('Абонент занят');   this.tone(320, 260); return; }
      if (p.type === 'end')     { this.cleanup('Звонок завершён'); this.tone(420, 200); return; }
    },

    async flushIce() {
      const list = this.pendingIce.splice(0);
      for (const c of list) { try { await this.pc.addIceCandidate(c); } catch (e) {} }
    },

    /* ---------- медиа + peer ---------- */
    async media(video) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: video ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } : false
        });
      } catch (err) {
        const n = err && err.name;
        if (n === 'NotAllowedError' || n === 'SecurityError') throw new Error('Доступ к микрофону/камере запрещён — разреши его в настройках браузера');
        if (n === 'NotFoundError' || n === 'OverconstrainedError') throw new Error('Микрофон или камера не найдены');
        if (n === 'NotReadableError') throw new Error('Микрофон/камера заняты другой программой');
        throw new Error('Не удалось включить микрофон/камеру');
      }
    },

    peer() {
      const pc = new RTCPeerConnection({ iceServers: iceServers(), iceCandidatePoolSize: 2, bundlePolicy: 'max-bundle' });
      this.remoteStream = new MediaStream();
      $('ptRemoteVideo').srcObject = this.remoteStream;

      pc.onicecandidate = e => {
        if (e.candidate) this.signal({ type: 'ice', to: this.peerId, callId: this.callId, candidate: e.candidate.toJSON() });
      };
      pc.ontrack = e => {
        e.streams[0].getTracks().forEach(t => {
          if (!this.remoteStream.getTracks().find(x => x.id === t.id)) this.remoteStream.addTrack(t);
        });
        const hasVideo = this.remoteStream.getVideoTracks().length > 0;
        $('ptCallCard').classList.toggle('has-remote-video', hasVideo);
        const v = $('ptRemoteVideo');
        v.srcObject = this.remoteStream;
        v.play().catch(() => {});
      };
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        log('pc state:', s);
        if (s === 'connected') { this.badge('На связи'); this.status('Соединение установлено'); }
        if (s === 'failed')    { toast('Связь не установилась — нужен TURN-сервер'); this.hangup('end'); }
        if (s === 'disconnected') this.badge('Связь пропадает...');
      };
      if (this.localStream) this.localStream.getTracks().forEach(t => pc.addTrack(t, this.localStream));
      return pc;
    },

    attachLocal() {
      const v = $('ptLocalVideo');
      v.srcObject = this.localStream;
      v.play().catch(() => {});
      $('ptCallCard').classList.toggle('has-local-video', this.video);
    },

    startTimer() {
      this.startedAt = Date.now();
      clearInterval(this.durationTimer);
      this.durationTimer = setInterval(() => {
        const s = Math.floor((Date.now() - this.startedAt) / 1000);
        this.status(String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'));
      }, 1000);
    },

    /* ---------- исходящий ---------- */
    async start(isVideo) {
      if (this.state !== 'idle') { toast('Звонок уже идёт'); return; }
      if (!me()) { toast('Сначала войди в аккаунт'); return; }
      if (!AppState.activeChat) { toast('Открой чат с человеком'); return; }
      if (!window.isSecureContext) { toast('Звонки работают только по HTTPS'); return; }
      if (!window.RTCPeerConnection) { toast('Браузер не поддерживает звонки'); return; }

      this.subscribe();
      this.peerId = AppState.activeChat.id;
      this.callId = 'c_' + Date.now() + '_' + Math.random().toString(16).slice(2);
      this.video = !!isVideo;
      this.state = 'outgoing';
      this.pendingIce = [];
      this.remoteReady = false;
      this.show('outgoing', AppState.activeChat);

      try {
        this.localStream = await this.media(this.video);
        this.attachLocal();
        this.pc = this.peer();
        const offer = await this.pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: this.video });
        await this.pc.setLocalDescription(offer);
        this.signal({
          type: 'invite', to: this.peerId, callId: this.callId,
          video: this.video, sdp: offer, name: displayName(me())
        });
        this.status('Ждём ответа...');
        this.tone(520, 250, 2600);
        clearTimeout(this.ringTimer);
        this.ringTimer = setTimeout(() => {
          if (this.state === 'outgoing') { this.signal({ type: 'end', to: this.peerId, callId: this.callId }); this.cleanup('Не отвечает'); }
        }, RING_TIMEOUT);
      } catch (err) {
        toast(err.message || 'Не удалось начать звонок');
        this.cleanup();
      }
    },

    /* ---------- приём ---------- */
    async accept() {
      if (this.state !== 'incoming') return;
      this.stopTone();
      clearTimeout(this.ringTimer);
      try {
        this.localStream = await this.media(this.video);
        this.attachLocal();
        this.pc = this.peer();
        await this.pc.setRemoteDescription(new RTCSessionDescription(this.offer));
        this.remoteReady = true;
        await this.flushIce();
        const answer = await this.pc.createAnswer();
        await this.pc.setLocalDescription(answer);
        this.signal({ type: 'accept', to: this.peerId, callId: this.callId, sdp: answer });
        this.state = 'active';
        this.show('active');
        this.startTimer();
      } catch (err) {
        toast(err.message || 'Не удалось принять звонок');
        this.signal({ type: 'decline', to: this.peerId, callId: this.callId });
        this.cleanup();
      }
    },

    hangup(kind) {
      if (this.state === 'idle') { this.hide(); return; }
      if (this.peerId) this.signal({ type: kind === 'decline' ? 'decline' : 'end', to: this.peerId, callId: this.callId });
      this.cleanup(kind === 'decline' ? 'Звонок отклонён' : 'Звонок завершён');
    },

    cleanup(message) {
      this.stopTone();
      clearTimeout(this.ringTimer);
      clearInterval(this.durationTimer);
      if (this.pc) { try { this.pc.close(); } catch (e) {} this.pc = null; }
      if (this.localStream) { this.localStream.getTracks().forEach(t => t.stop()); this.localStream = null; }
      this.remoteStream = null;
      const rv = $('ptRemoteVideo'), lv = $('ptLocalVideo'), card = $('ptCallCard');
      if (rv) rv.srcObject = null;
      if (lv) lv.srcObject = null;
      if (card) card.classList.remove('has-remote-video', 'has-local-video');
      this.state = 'idle'; this.peerId = null; this.callId = null; this.offer = null;
      this.pendingIce = []; this.remoteReady = false;
      this.hide();
      if (message) toast('📞 ' + message);
    }
  };

  /* кнопки 📞 / 📹 — v30 подменял их на заглушку "Звонки позже", возвращаем на место */
  function bindCallButtons() {
    const buttons = document.querySelectorAll('.chat-header-actions .header-icon-btn');
    if (buttons[0]) { buttons[0].onclick = e => { e.preventDefault(); Call.start(false); }; buttons[0].title = 'Звонок'; buttons[0].style.display = 'flex'; }
    if (buttons[1]) { buttons[1].onclick = e => { e.preventDefault(); Call.start(true);  }; buttons[1].title = 'Видеозвонок'; buttons[1].style.display = 'flex'; }
    document.querySelectorAll('.tg-action-card-btn').forEach(btn => {
      const attr = btn.getAttribute('onclick') || '';
      if (attr.indexOf('startCall') !== -1) {
        const wantVideo = attr.indexOf('true') !== -1;
        btn.removeAttribute('onclick');
        btn.onclick = e => {
          e.preventDefault();
          try { AppEngine.closeModal('userProfileModal'); } catch (err) {}
          Call.start(wantVideo);
        };
      }
    });
  }

  function lockWebRTCEngine() {
    if (!window.WebRTCEngine) return;
    const start = isVideo => Call.start(!!isVideo);
    const end = () => Call.hangup('end');
    try {
      Object.defineProperty(WebRTCEngine, 'startCall', { configurable: false, get: () => start, set: () => {} });
      Object.defineProperty(WebRTCEngine, 'endCall',   { configurable: false, get: () => end,   set: () => {} });
    } catch (e) { WebRTCEngine.startCall = start; WebRTCEngine.endCall = end; }
    try { if (window.V36) V36.handleRtcEvent = () => {}; } catch (e) {}   /* глушим старый сигналинг v36 */
  }

  /* =========================================================
     3. Мелочь: v37 ищет window.V35 для точки "в сети", а её никто не создал
     ========================================================= */
  function v35Shim() {
    if (window.V35) return;
    window.V35 = { isOnline: ls => !!ls && (Date.now() - new Date(ls).getTime() < 20000) };
  }

  const V38 = {
    init() {
      Call.ui();
      lockMessaging();
      bindInput();
      lockWebRTCEngine();
      bindCallButtons();
      v35Shim();
      Call.subscribe();
      setInterval(() => { bindInput(); bindCallButtons(); Call.subscribe(); }, 2500);
      window.addEventListener('beforeunload', () => { if (Call.state !== 'idle') Call.hangup('end'); });
      log('готово: отправка сообщений и звонки перехвачены');
    }
  };

  window.PTV38 = { Call, Send, getClient };

  const boot = () => {
    if (!window.AppState || !AppState.currentUser || !window.MessagingEngine) { setTimeout(boot, 400); return; }
    V38.init();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 1900));
  else setTimeout(boot, 1900);
})();
</script>
